<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Diagram of a loop that submits tests, updates reference files, commits and re-runs">
<rect width="400" height="300" fill="#121a26"/>
<circle cx="200" cy="150" r="82" stroke="#243042" stroke-width="2"/>
<path d="M200 68a82 82 0 0 1 72 42" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/><path d="M262 98l12 14-18 2" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M200 232a82 82 0 0 1-72-42" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity=".6"/>
<g fill="#0c1119" stroke="#5eead4" stroke-width="2"><circle cx="200" cy="68" r="12"/><circle cx="282" cy="150" r="12"/><circle cx="200" cy="232" r="12"/><circle cx="118" cy="150" r="12"/></g>
<g font-family="JetBrains Mono,monospace" font-size="11" fill="#e8edf4" text-anchor="middle"><text x="200" y="56">submit</text><text x="326" y="154">update</text><text x="200" y="256">commit</text><text x="74" y="154">re-run</text></g>
<g font-family="JetBrains Mono,monospace" font-size="10" fill="#a3afc2"><text x="24" y="26">golden files</text></g>
<g stroke="#2c3a50" stroke-width="1.5"><rect x="170" y="130" width="60" height="40" rx="5" fill="#0c1119"/></g>
<g font-family="JetBrains Mono,monospace" font-size="10" fill="#5eead4" text-anchor="middle"><text x="200" y="146">PNG PDF</text><text x="200" y="161">DXF</text></g>
<g font-family="JetBrains Mono,monospace" font-size="11" fill="#a3afc2"><text x="24" y="284">until no failures remain</text></g>
</svg>
